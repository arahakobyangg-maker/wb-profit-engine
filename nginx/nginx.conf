worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Rate Limiting Zone: 10 requests/sec per client IP (10MB shared memory)
    limit_req_zone $binary_remote_addr zone=wb_api_limit:10m rate=10r/s;

    # Round-Robin Upstream Pool across isolated FastAPI replicas on frontend_net
    upstream wb_backend {
        least_conn; # Or default round-robin; configured for strict Round-Robin below:
        server wb-api-1:8000 weight=1 max_fails=3 fail_timeout=15s;
        server wb-api-2:8000 weight=1 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Hardened Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Upstream Health Check Endpoint
        location = /nginx-health {
            access_log off;
            return 200 '{"status":"nginx_lb_healthy"}';
        }

        # API & OpenAPI Proxy with Rate Limiting and Failover
        location / {
            limit_req zone=wb_api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://wb_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            # Automatic failover to healthy replica if one container errors or times out
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
