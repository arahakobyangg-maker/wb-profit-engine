services:
  # ----------------------------------------------------------------------------
  # 1. Nginx Reverse Proxy & Round-Robin Load Balancer (Public Entrypoint)
  # ----------------------------------------------------------------------------
  nginx-lb:
    image: nginx:1.25-alpine
    container_name: wb-nginx-lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      wb-api-1:
        condition: service_healthy
      wb-api-2:
        condition: service_healthy
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # ----------------------------------------------------------------------------
  # 2. FastAPI Replica 1 (Zero Host Ports Exposed)
  # ----------------------------------------------------------------------------
  wb-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-wb-org/wb-profit-engine}:latest
    container_name: wb-api-1
    hostname: wb-api-1
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 3. FastAPI Replica 2 (Zero Host Ports Exposed)
  # ----------------------------------------------------------------------------
  wb-api-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-wb-org/wb-profit-engine}:latest
    container_name: wb-api-2
    hostname: wb-api-2
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 4. PostgreSQL 16 Database (Isolated on internal backend_net, Zero Host Ports)
  # ----------------------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: wb-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wb_profit_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wb_admin} -d ${POSTGRES_DB:-wb_profit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 5. Redis 7 Cache (Isolated on internal backend_net, Zero Host Ports)
  # ----------------------------------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: wb-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M

volumes:
  pg_data:
    driver: local

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
